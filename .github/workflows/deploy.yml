name: deploy

on:
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: [self-hosted, public]
    steps:
      - uses: actions/checkout@v4

      - name: Deploy
        run: |
          docker compose -p alcatraz-rdv -f Docker/docker-compose.yml up -d --no-build --remove-orphans
          docker image prune -f
