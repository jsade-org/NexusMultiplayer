name: nexus
services:
  alcatraz-rdv:
    image: alcatraz-rdv:latest
    ports:
      - "21001:21001/udp"
      - "21006:21006/udp"
    build:
      context: ./server
    volumes:
      - ./data/alcatraz/serverFiles/:/var/lib/alcatraz/serverFiles/
      - /home/nexus/alcatraz:/var/lib/alcatraz/data/
    expose:
      - "5000"